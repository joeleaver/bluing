name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - name: Build the syntax crate for wasm
        run: cargo build -p bluing-syntax --target wasm32-unknown-unknown --locked
      - name: Examples are valid Rust
        run: |
          for f in examples/*.blu; do
            cargo run -q -p bluing-cli -- check "$f"
            rustc --edition 2024 --crate-type bin -o /tmp/example "$f"
          done
